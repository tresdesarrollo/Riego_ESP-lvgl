                  grid_cell_x_align: end
                  width: 50%
                  height: 35
                  options: *start_options
                  selected_index: 26
                  mode: NORMAL
                  on_value:
                    then:
                      - lambda: |-
                          const auto &opts = id(programa_1_inicio).traits.get_options();
                          if (x >= opts.size()) return;
                          auto idx = id(programa_1_inicio).active_index();
                          if (idx.has_value() && idx.value() == x) return;  // evita el bucle select <-> roller
                          auto call = id(programa_1_inicio).make_call();
                          call.set_index(x);
                          call.perform();

