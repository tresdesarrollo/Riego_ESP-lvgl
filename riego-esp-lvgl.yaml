interval:
  - interval: 1s
    then:
      # actualizar reloj
      - lvgl.label.update:
          id: lbl_reloj
          text:
            format: "%02d:%02d:%02d"
            args:
              - id(rtc_time).now().hour
              - id(rtc_time).now().minute
              - id(rtc_time).now().second
      - lvgl.label.update:
          id: lbl_reloj_config
          text:
            format: "%02d:%02d:%02d"
            args:
              - id(rtc_time).now().hour
              - id(rtc_time).now().minute
              - id(rtc_time).now().second

      # Riego AUTOMÁTICO: aquí solo se detecta la hora de inicio; la decisión
      # (normal / reducido / saltado) la toma el script decidir_riego.
      # El riego manual (zonas, "1 Ronda") no pasa por aquí y no mira la lluvia.
      - lambda: |-
          auto ahora = id(rtc_time).now();
          if (!ahora.is_valid()) return;

          // Si está lloviendo justo ahora, no se arranca ningún programa (solo con el sensor activado)
          if (id(lluvia_activa).state && id(sensor_lluvia).state) return;

          // Día LOCAL (mismo cálculo que en "Saltar días"): el día UTC cambia a las 01:00/02:00 locales
          int current_day = (ahora.timestamp - (ahora.hour * 3600 + ahora.minute * 60 + ahora.second) + 43200) / 86400;
          if ((current_day - id(var_dias_saltar_inicio)) % ((int)id(saltar_dias).state + 1) != 0) return;

          if (id(ejecutar_programa).is_running() || id(decidir_riego).is_running()) return;

          auto time_str = ahora.strftime("%H:%M");
          bool toca = (id(programa_1).state && time_str == id(programa_1_inicio).current_option()) ||
                      (id(programa_2).state && time_str == id(programa_2_inicio).current_option()) ||
                      (id(programa_3).state && time_str == id(programa_3_inicio).current_option()) ||
                      (id(programa_4).state && time_str == id(programa_4_inicio).current_option());
          if (!toca) return;

          // Evaluar una sola vez por minuto (evita repetir la decisión 60 veces)
          uint32_t minuto = ahora.timestamp / 60;
          if (minuto == id(ultimo_minuto_eval)) return;
          id(ultimo_minuto_eval) = minuto;

          id(decidir_riego).execute();

  # Contador de lluvia: ventana deslizante de 24 h con un bucket de segundos por hora
  - interval: 1s
    then:
      - lambda: |-
          auto ahora = id(rtc_time).now();
          if (!ahora.is_valid()) return;
          uint32_t ts = ahora.timestamp;
          uint32_t hora = ts / 3600;

          // Avanzar el buffer: vaciar las horas que han pasado desde la última vez
          uint32_t ultima = id(lluvia_hora_abs);
          if (ultima == 0) {
            for (int i = 0; i < 24; i++) id(lluvia_seg_hora)[i] = 0;
          } else if (hora > ultima) {
            uint32_t pasos = hora - ultima;
            if (pasos > 24) pasos = 24;
            for (uint32_t k = 1; k <= pasos; k++) id(lluvia_seg_hora)[(ultima + k) % 24] = 0;
          }
          id(lluvia_hora_abs) = hora;

          // El sensor está en alto: el riego no lo moja, así que cuenta toda la lluvia real
          if (id(lluvia_activa).state && id(sensor_lluvia).state) id(lluvia_seg_hora)[hora % 24]++;

script:
  #Temporizador de inactividad de pantalla.
  - id: inactivity_timer
    mode: restart
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 200ms
      - if:
          condition:
            light.is_off: display_backlight
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda return id(brillo_pantalla);
      - delay: !lambda 'return id(sleep_time).state * 1000;'
      - globals.set:
          id: pantalla_durmiendo
          value: "true"
      - lvgl.page.show: pagina_inicio
      - light.turn_off:
          id: display_backlight
      # Anti burn-in del LCD: con la pantalla apagada se pausa LVGL y se pinta
      # "nieve" (ruido aleatorio) para que el panel no pase días con la misma imagen.
      # Se reanuda solo al tocar (ver on_touch del touchscreen).
      - lvgl.pause:
          show_snow: true
  
  # Textos de zonas
  - id: cerrar_popup_z1
    then:
      - lvgl.widget.hide: popup_nombre_z1

  - id: cerrar_popup_z2
    then:
      - lvgl.widget.hide: popup_nombre_z2

  - id: cerrar_popup_z3
    then:
      - lvgl.widget.hide: popup_nombre_z3

  - id: cerrar_popup_z4
    then:
      - lvgl.widget.hide: popup_nombre_z4

  - id: cerrar_popup_z5
    then:
