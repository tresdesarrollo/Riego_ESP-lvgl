      - script.wait: zona5_espera
      - switch.turn_off: riego_canal5
    turn_off_action:
      - script.stop: zona5_espera
      - lambda: |-
          id(var_zona_restante)[4] = 0;
          id(zona5_restante).update();
      - switch.turn_off: riego_canal5

  - platform: template
    name: "Riego zona 6"
