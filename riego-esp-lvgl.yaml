  # Minutos de lluvia en las últimas 24 h
  - platform: template
    id: lluvia_24h
    name: "Lluvia últimas 24 h"
    accuracy_decimals: 0
    unit_of_measurement: min
    update_interval: 60s
    lambda: |-
      int s = 0;
      for (int i = 0; i < 24; i++) s += id(lluvia_seg_hora)[i];
      return s / 60.0f;
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_lluvia_24h
            text: !lambda |-
              return str_sprintf("24 h: %d min", (int) x);

