      bg_color: 0x4A4A4A
      bg_grad_color: 0x3A3A3A
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x666666
      border_width: 1
      text_color: 0xFFFFFF
      pressed:
        bg_color: 0x2E2E2E
        bg_grad_color: 0x1F1F1F
      checked:
        bg_color: 0x1F8F3A
        bg_grad_color: 0x0B5E22
        text_color: 0xFFFFFF
        border_color: 0x2FBF4A
    roller:
      bg_color: 0x5A5A5A
      bg_grad_color: 0x4A4A4A
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x666666
      border_width: 1
      radius: 5
      text_color: 0x888888
      #text_font: roboto_16
      selected:
        bg_color: 0x1F8F3A
        bg_grad_color: 0x0B5E22
        bg_grad_dir: VER
        bg_opa: COVER
        text_color: 0xFFFFFF
        border_color: 0x2FBF4A
        border_width: 1
    buttonmatrix:
      bg_opa: TRANSP
      border_color: 0x0077b3
      border_width: 0
      text_color: 0xFFFFFF
      pad_all: 0
      items: # set all your buttonmatrix buttons to use your custom defined styles and font
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 1
        text_color: 0xFFFFFF
        text_font: roboto_24
        pressed:
          bg_color: 0xA914FF
          bg_grad_color: 0xFF1462
        checked:
          bg_color: 0x1d5f96
          bg_grad_color: 0x03324A
          text_color: 0x005580
    switch:
      bg_color: 0xC0C0C0
      bg_grad_color: 0xb0b0b0
      bg_grad_dir: VER
      bg_opa: COVER
      checked:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xC0C0C0
        bg_grad_dir: VER
        bg_opa: COVER
    slider:
      border_width: 1
      #border_opa: 15%
      bg_color: 0x0F1929
      #bg_opa: 15%
      indicator:
        bg_color: 0xFBBF24
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: 35%
        shadow_color: 0xFBBF24
        shadow_opa: cover
        shadow_spread: 1
        shadow_width: 4
        radius: 8
      knob:
        bg_color: 0xFFFFFF
        bg_opa: 85%
        border_width: 2
        border_color: 0x58ED22
        radius: 50
        pad_all: 0

