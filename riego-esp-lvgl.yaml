      - script.wait: zona6_espera
      - switch.turn_off: riego_canal6
    turn_off_action:
      - script.stop: zona6_espera
      - lambda: |-
          id(var_zona_restante)[5] = 0;
          id(zona6_restante).update();
      - switch.turn_off: riego_canal6

  - platform: template
    name: "Riego zona 7"
    id: riego_zona7
    lambda: 'return id(riego_canal7).state;'
    turn_on_action:
      - switch.turn_on: riego_canal7
      - script.execute: zona7_espera
      - script.wait: zona7_espera
      - switch.turn_off: riego_canal7
    turn_off_action:
      - script.stop: zona7_espera
      - lambda: |-
          id(var_zona_restante)[6] = 0;
          id(zona7_restante).update();
      - switch.turn_off: riego_canal7

  - platform: template
    name: "Riego zona 8"
    id: riego_zona8
    lambda: 'return id(riego_canal8).state;'
    turn_on_action:
      - switch.turn_on: riego_canal8
      - script.execute: zona8_espera
      - script.wait: zona8_espera
      - switch.turn_off: riego_canal8
    turn_off_action:
      - script.stop: zona8_espera
      - lambda: |-
          id(var_zona_restante)[7] = 0;
          id(zona8_restante).update();
      - switch.turn_off: riego_canal8

  # Canales de riego (1-8)
  - platform: gpio
    id: riego_canal1
    restore_mode: ALWAYS_OFF
    pin:
      xl9535: xl9535_8_hub
      number: 0
      mode:
        output: true
      inverted: false
    on_turn_on:
      - lvgl.label.update:
            id: lbl_estado
            text: Regando zona 1
      - lvgl.widget.update:
            id: btn_zona_1
            state:
              checked: true
      - lvgl.label.update:
          id: lbl_zona_regando
          text: "Zona 1"
          hidden: false
      - lvgl.label.update:
          id: clima_ico
          text: "\U000F1060"
          text_color: 0x4FC3F7
      - lvgl.label.update:
          id: lbl_tiempo_restante
          hidden: false
          text_color: 0x4FC3F7
      - lvgl.spinner.update:
          id: spinner_id
          hidden: false
          spin_time: 500ms
          arc_color: 0x31de70
          indicator:
            arc_color: 0xffbc02
    on_turn_off:
      - lvgl.label.update:
            id: lbl_estado
            text: Riego esperando a la hora
      - lvgl.widget.update:
            id: btn_zona_1
            state:
              checked: false
      - lvgl.label.update:
          id: lbl_zona_regando
          text: "Zona 1"
          hidden: true
      - lvgl.label.update:
          id: lbl_tiempo_restante
          hidden: true
      - lvgl.spinner.update:
          id: spinner_id
          hidden: true
      - lvgl.label.update:
          id: clima_ico
          text: !lambda |-
            if (id(sensor_lluvia).state) {
              return std::string("\U000F0597");
            } else {
              return std::string("\U000F0599");
            }
          text_color: !lambda |-
            if (id(sensor_lluvia).state) {
              return lv_color_hex(0x4FC3F7);
            } else {
              return lv_color_hex(0xFFD600);
            }

  - platform: gpio
    id: riego_canal2
    restore_mode: ALWAYS_OFF
    pin:
      xl9535: xl9535_8_hub
      number: 1
      mode:
        output: true
      inverted: false
    on_turn_on:
      - lvgl.label.update:
            id: lbl_estado
            text: Regando zona 2
      - lvgl.widget.update:
            id: btn_zona_2
            state:
              checked: true
      - lvgl.label.update:
          id: lbl_zona_regando
          text: "Zona 2"
          hidden: false
      - lvgl.label.update:
          id: clima_ico
          text: "\U000F1060"
          text_color: 0x4FC3F7
      - lvgl.label.update:
