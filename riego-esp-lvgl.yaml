button:
  - platform: template
    name: "Borrar histórico de lluvia"
    entity_category: config
    on_press:
      - script.execute: borrar_historial_lluvia

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin:
      number: 3
      ignore_strapping_warning: true
    #reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - if:
            condition:
              lambda: 'return id(pantalla_durmiendo);'
            then:
              - globals.set:
                  id: pantalla_durmiendo
                  value: "false"
              # Reanudar LVGL antes de encender la luz para no ver la "nieve"
              - if:
                  condition: lvgl.is_paused
                  then:
                    - lvgl.resume:
                    - lvgl.widget.redraw:
                    - delay: 200ms
              - light.turn_on: display_backlight
              - delay: 2s
              #- lvgl.page.show: pagina_inicio
              - script.execute: inactivity_timer
            else:
              - script.execute: inactivity_timer

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [21,48,40,39]

display:
  - platform: mipi_spi
    id: my_display
    model: JC4827W543
    bus_mode: quad
    #dimensions:
      #width: 480
      #height: 272
    cs_pin:
      number: GPIO45
      ignore_strapping_warning: true
    #data_rate: 20MHz
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false 

