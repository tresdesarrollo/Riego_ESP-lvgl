          id(var_zona_restante)[7] = (int) roundf(id(zona8_duracion).state * id(multiplicador_tiempo).state / 100.0f * id(factor_lluvia));
          id(zona8_restante).update();
      - while:
          condition:
            lambda: "return id(var_zona_restante)[7] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zona_restante)[7] -= 1;
                id(zona8_restante).update();

  # Borra el histórico de lluvia de las últimas 24 h (botón de pantalla y de HA)
  - id: borrar_historial_lluvia
    mode: single
    then:
      - lambda: |-
          for (int i = 0; i < 24; i++) id(lluvia_seg_hora)[i] = 0;
          id(lluvia_24h).update();

  # Decisión del riego automático según los minutos de lluvia de las últimas 24 h
  - id: decidir_riego
    mode: single
    then:
      - lambda: |-
          if (!id(lluvia_activa).state) {
            id(decision_lluvia) = 2;
            id(factor_lluvia) = 1.0f;
            std::string t = "Sensor lluvia OFF: riego normal";
            ESP_LOGI("riego", "Decisión automática: %s", t.c_str());
            id(decision_riego_txt).publish_state(t);
            return;
          }
          int seg = 0;
          for (int i = 0; i < 24; i++) seg += id(lluvia_seg_hora)[i];
          int min_lluvia = (int) roundf(seg / 60.0f);
          float u_reducir = id(lluvia_umbral_reducir).state;
          float u_saltar = id(lluvia_umbral_saltar).state;
          std::string txt;
          if (u_saltar > 0 && min_lluvia >= u_saltar) {
            id(decision_lluvia) = 0;
            id(factor_lluvia) = 1.0f;
            txt = str_sprintf("Saltado: %d min de lluvia", min_lluvia);
          } else if (u_reducir > 0 && min_lluvia >= u_reducir) {
            int pct = (int) id(lluvia_factor_reducido).state;
            id(decision_lluvia) = 1;
            id(factor_lluvia) = pct / 100.0f;
            txt = str_sprintf("Riego al %d%%: %d min de lluvia", pct, min_lluvia);
          } else {
            id(decision_lluvia) = 2;
            id(factor_lluvia) = 1.0f;
            txt = str_sprintf("Riego normal (%d min de lluvia)", min_lluvia);
          }
          ESP_LOGI("riego", "Decisión automática: %s", txt.c_str());
          id(decision_riego_txt).publish_state(txt);
      - if:
          condition:
            lambda: return id(decision_lluvia) != 0;
          then:
            - script.execute: ejecutar_programa
          else:
            - lvgl.label.update:
                id: lbl_estado
                text: !lambda return id(decision_riego_txt).state;

  # Riego.
  - id: ejecutar_programa
    mode: single
    then:
      - lvgl.widget.update:
            id: btn_1_ronda
            state:
              checked: true
      - switch.turn_on: riego_zona1
      - script.wait: zona1_espera
      - delay: 250ms
      - switch.turn_on: riego_zona2
      - script.wait: zona2_espera
      - delay: 250ms
      - switch.turn_on: riego_zona3
      - script.wait: zona3_espera
      - delay: 250ms
      - switch.turn_on: riego_zona4
      - script.wait: zona4_espera
      - delay: 250ms
      - switch.turn_on: riego_zona5
      - script.wait: zona5_espera
      - delay: 250ms
      - switch.turn_on: riego_zona6
      - script.wait: zona6_espera
      - delay: 250ms
      - switch.turn_on: riego_zona7
      - script.wait: zona7_espera
      - delay: 250ms
      - switch.turn_on: riego_zona8
      - script.wait: zona8_espera
      - lvgl.widget.update:
            id: btn_1_ronda
            state:
              checked: false
      - globals.set:
          id: factor_lluvia
          value: "1.0"
