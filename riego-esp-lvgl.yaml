    widget: spin_zona8_inicio
    id: zona8_duracion
    name: "zona 8 duración"
    mode: box
    unit_of_measurement: min
    restore_value: true

  # Multiplicador de tiempo
  - platform: lvgl
    widget: dm_multiplicador_spinbox
    id: multiplicador_tiempo
    name: "Multiplicador de tiempo"
    mode: box
    unit_of_measurement: "%"
    restore_value: true

  # Saltar días  
  - platform: lvgl
    widget: dm_saltar_dias_spinbox
    id: saltar_dias
    name: "Saltar dias"
    mode: box
    unit_of_measurement: "días"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            // Número de día LOCAL (no UTC): medianoche local + 12 h, para que el día cambie a las 00:00
            auto ahora = id(rtc_time).now();
            id(var_dias_saltar_inicio) = (ahora.timestamp - (ahora.hour * 3600 + ahora.minute * 60 + ahora.second) + 43200) / 86400;
  
  # Luz de pantalla.
  - platform: lvgl
    widget: dm_brillo_tiempo_slider
    name: Tiempo de iluminacion de pantalla
    trigger: on_value
    id: sleep_time
    unit_of_measurement: "s"
    restore_value: true
    mode: box

  # ---- Lógica de lluvia (solo riego automático), se ajusta en Ajustes > Lluvia ----
  - platform: lvgl
    widget: spin_lluvia_reducir
    id: lluvia_umbral_reducir
    name: "Lluvia: reducir riego desde"
    mode: box
    unit_of_measurement: min
    restore_value: true

  - platform: lvgl
    widget: spin_lluvia_factor
    id: lluvia_factor_reducido
    name: "Lluvia: tiempo de riego reducido"
    mode: box
    unit_of_measurement: "%"
    restore_value: true

  - platform: lvgl
    widget: spin_lluvia_saltar
    id: lluvia_umbral_saltar
    name: "Lluvia: saltar riego desde"
    mode: box
    unit_of_measurement: min
    restore_value: true

sensor:
  - platform: template
    id: zona1_restante
    name: "Zona 1, restante"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_zona_restante)[0];"
    on_value:
      then:
        - if:
            condition:
              lambda: return id(riego_canal1).state;
            then:
              - lvgl.label.update:
