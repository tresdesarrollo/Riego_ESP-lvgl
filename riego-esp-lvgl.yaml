  - id: cerrar_popup_z8
    then:
      - lvgl.widget.hide: popup_nombre_z8
          
  - id: zona1_espera
    then:
      - lambda: |-
          id(var_zona_restante)[0] = (int) roundf(id(zona1_duracion).state * id(multiplicador_tiempo).state / 100.0f * id(factor_lluvia));
          id(zona1_restante).update();
      - while:
          condition:
            lambda: "return id(var_zona_restante)[0] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zona_restante)[0] -= 1;
                id(zona1_restante).update();

  - id: zona2_espera
    then:
      - lambda: |-
          id(var_zona_restante)[1] = (int) roundf(id(zona2_duracion).state * id(multiplicador_tiempo).state / 100.0f * id(factor_lluvia));
          id(zona2_restante).update();
      - while:
          condition:
            lambda: "return id(var_zona_restante)[1] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zona_restante)[1] -= 1;
                id(zona2_restante).update();

