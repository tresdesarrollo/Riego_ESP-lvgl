switch:
  # Reinicio esp
  - platform: restart
    name: $hostname reiniciar
  
  # Lógica de lluvia activada / desactivada (desactivada = riego automático normal)
  - platform: template
    id: lluvia_activa
    name: "Sensor de lluvia activo"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lvgl.widget.update:
            id: btn_lluvia_activa
            state:
              checked: true
        - lvgl.label.update:
            id: lbl_lluvia_activa
            text: "Sensor: ACTIVO"
        - lvgl.label.update:
            id: ico_inicio_lluvia
            text: "\U000F0208"
            text_color: 0x1F8F3A
        - lvgl.label.update:
            id: lbl_inicio_lluvia
            text: "Sensor lluvia: ACTIVO"
            text_color: 0x1F8F3A
    on_turn_off:
      then:
        - lvgl.widget.update:
            id: btn_lluvia_activa
            state:
              checked: false
        - lvgl.label.update:
            id: lbl_lluvia_activa
            text: "Sensor: DESACTIVADO"
        - lvgl.label.update:
            id: ico_inicio_lluvia
            text: "\U000F0209"
            text_color: 0xF57F02
        - lvgl.label.update:
            id: lbl_inicio_lluvia
            text: "Sensor lluvia: OFF"
            text_color: 0xF57F02

  # Programas 1-4
  - platform: template
    id: programa_1
    name: "Programa riego 1"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p1
            state:
              checked: true
    on_turn_off:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p1
            state:
              checked: false

  - platform: template
    id: programa_2
    name: "Programa riego 2"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p2
            state:
              checked: true
    on_turn_off:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p2
            state:
              checked: false

  - platform: template
    id: programa_3
    name: "Programa riego 3"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p3
            state:
              checked: true
    on_turn_off:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p3
            state:
              checked: false

  - platform: template
    id: programa_4
    name: "Programa riego 4"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p4
            state:
              checked: true
    on_turn_off:
      then:
        - lvgl.widget.update:
            id: btn_ajuste_p4
            state:
              checked: false

  - platform: template
    name: "Riego zona 1"
    id: riego_zona1
    lambda: 'return id(riego_canal1).state;'
    turn_on_action:
      - switch.turn_on: riego_canal1
      - script.execute: zona1_espera
      - script.wait: zona1_espera
      - switch.turn_off: riego_canal1
    turn_off_action:
      - script.stop: zona1_espera
      - lambda: |-
          id(var_zona_restante)[0] = 0;
          id(zona1_restante).update();
      - switch.turn_off: riego_canal1

  - platform: template
    name: "Riego zona 2"
    id: riego_zona2
    lambda: 'return id(riego_canal2).state;'
    turn_on_action:
